<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics Quiz</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 14px 20px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 18px;
      margin: 0;
    }
    header a {
      color: #38bdf8;
      font-size: 13px;
      text-decoration: none;
      word-break: break-all;
    }
    header a:hover { text-decoration: underline; }
    .frame-wrap {
      flex: 1;
      display: flex;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      min-height: 80vh;
    }
    footer {
      padding: 8px 20px;
      font-size: 12px;
      color: #94a3b8;
      background: #1e293b;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Physics Quiz</h1>
    <a href="{{ quiz_url }}" target="_blank" rel="noopener noreferrer">
      Source: {{ quiz_url }}
    </a>
  </header>

  <div class="frame-wrap">
    <iframe
      src="{{ quiz_url }}"
      title="Physics Quiz"
      allow="fullscreen"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <footer>
    Hosted on our site — quiz content served from the source linked above.
  </footer>
</body>
</html>
